[package]
name = "pdq-rs"
version = "1.0.0"
edition = "2024"
description = "Rust bindings for Facebook's PDQ image hashing library"
license = "MIT"
readme = "README.md"
keywords = ["pdq", "image-hashing", "perceptual-hashing", "bindings"]
categories = ["api-bindings", "computer-vision", "encoding"]
repository = "https://github.com/giddyos/pdq-rs"
exclude = ["ThreatExchange/*"]

[dependencies]
image = { version = "0.25.10", default-features = false }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }

[build-dependencies]
bindgen = "0.72.1"
cc = "1.0"
